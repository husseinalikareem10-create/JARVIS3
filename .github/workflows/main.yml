name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Unpack JARVIS project
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

      - name: Configure Gemini API key
        shell: bash
        working-directory: source
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env

      - name: Create debug keystore
        shell: bash
        working-directory: source
        run: |
          keytool -genkeypair -v             -keystore debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Make compile SDK CI-compatible
        shell: bash
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          old = 'compileSdk { version = release(36) { minorApiLevel = 1 } }'
          if old in s:
              s = s.replace(old, 'compileSdk = 36')
          p.write_text(s)
          PY

      - name: Add Gemini retry for 503 and 429
        shell: bash
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/network/GeminiClient.kt")
          s = p.read_text()

          old_call = '            val response = okHttpClient.newCall(request).execute()'
          new_call = '            val response = executeWithRetry(request)'
          if old_call not in s:
              raise SystemExit("Could not find Gemini request execution line")
          s = s.replace(old_call, new_call, 1)

          marker = '    private fun sanitizeTextChunk(text: String): String {'
          helper = "\n".join([
              '    private fun executeWithRetry(request: Request): okhttp3.Response {',
              '        var lastResponse: okhttp3.Response? = null',
              '        var attempt = 0',
              '        while (attempt < 5) {',
              '            lastResponse?.close()',
              '            val response = okHttpClient.newCall(request).execute()',
              '            if (response.code != 429 && response.code !in 500..504) {',
              '                return response',
              '            }',
              '            lastResponse = response',
              '            if (attempt < 4) {',
              '                val waitMs = when (attempt) {',
              '                    0 -> 800L',
              '                    1 -> 1600L',
              '                    2 -> 3200L',
              '                    else -> 5000L',
              '                }',
              '                Thread.sleep(waitMs)',
              '            }',
              '            attempt++',
              '        }',
              '        return lastResponse ?: okHttpClient.newCall(request).execute()',
              '    }',
              '',
          ])

          if marker not in s:
              raise SystemExit("Could not find insertion point in GeminiClient.kt")
          s = s.replace(marker, helper + marker, 1)

          p.write_text(s)
          PY

      - name: Build debug APK
        shell: bash
        working-directory: source
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
