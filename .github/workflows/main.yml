name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Unpack JARVIS project
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

      - name: Configure Gemini API key
        shell: bash
        working-directory: source
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env

      - name: Create debug keystore
        shell: bash
        working-directory: source
        run: |
          keytool -genkeypair -v             -keystore debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Make compile SDK CI-compatible
        shell: bash
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          old = 'compileSdk { version = release(36) { minorApiLevel = 1 } }'
          if old in s:
              s = s.replace(old, 'compileSdk = 36')
          p.write_text(s)
          PY

      - name: Add Gemini retry for 503 and 429
        shell: bash
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/network/GeminiClient.kt")
          s = p.read_text()

          old_call = '            val response = okHttpClient.newCall(request).execute()'
          new_call = '            val response = executeWithRetry(request)'
          if old_call not in s:
              raise SystemExit("Could not find Gemini request execution line")
          s = s.replace(old_call, new_call, 1)

          marker = '    private fun sanitizeTextChunk(text: String): String {'
          helper = "\n".join([
              '    private fun executeWithRetry(request: Request): okhttp3.Response {',
              '        var lastResponse: okhttp3.Response? = null',
              '        var attempt = 0',
              '        while (attempt < 5) {',
              '            lastResponse?.close()',
              '            val response = okHttpClient.newCall(request).execute()',
              '            if (response.code != 429 && response.code !in 500..504) {',
              '                return response',
              '            }',
              '            lastResponse = response',
              '            if (attempt < 4) {',
              '                val waitMs = when (attempt) {',
              '                    0 -> 800L',
              '                    1 -> 1600L',
              '                    2 -> 3200L',
              '                    else -> 5000L',
              '                }',
              '                Thread.sleep(waitMs)',
              '            }',
              '            attempt++',
              '        }',
              '        return lastResponse ?: okHttpClient.newCall(request).execute()',
              '    }',
              '',
          ])

          if marker not in s:
              raise SystemExit("Could not find insertion point in GeminiClient.kt")
          s = s.replace(marker, helper + marker, 1)

          p.write_text(s)
          PY


      - name: Fix Android TTS
        shell: bash
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          recognition_block = '        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>'
          tts_block = '        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>'
          if 'android.intent.action.TTS_SERVICE' not in m:
              if recognition_block not in m:
                  raise SystemExit("RecognitionService query block not found")
              m = m.replace(recognition_block, recognition_block + '\n' + tts_block, 1)
              manifest.write_text(m)

          p = Path("app/src/main/java/com/example/audio/JarvisTtsManager.kt")
          s = p.read_text()

          if 'private var pendingSpeech' not in s:
              s = s.replace(
                  '    private var isInitialized = false\n',
                  '    private var isInitialized = false\n    private var pendingSpeech: Pair<String, Boolean>? = null\n',
                  1
              )

          s = s.replace(
              '        tts = TextToSpeech(context, this)',
              '        tts = TextToSpeech(context.applicationContext, this)'
          )

          init_old = '            isInitialized = true\n            setupVoice()'
          init_new = '            isInitialized = true\n            setupVoice()\n            pendingSpeech?.let { (text, queueAdd) ->\n                pendingSpeech = null\n                speak(text, queueAdd)\n            }'
          if init_old in s and 'pendingSpeech?.let' not in s:
              s = s.replace(init_old, init_new, 1)

          guard_old = '        if (!isInitialized || text.isBlank()) return'
          guard_new = '        if (text.isBlank()) return\n        if (!isInitialized) {\n            pendingSpeech = text to isQueueAdd\n            return\n        }'
          if guard_old in s:
              s = s.replace(guard_old, guard_new, 1)

          ar_old = '            if ((tts?.isLanguageAvailable(arLocale) ?: -1) >= TextToSpeech.LANG_AVAILABLE) {\n                tts?.language = arLocale\n            }'
          ar_new = '            val arAvailability = tts?.isLanguageAvailable(arLocale) ?: TextToSpeech.LANG_NOT_SUPPORTED\n            if (arAvailability >= TextToSpeech.LANG_AVAILABLE) {\n                tts?.language = arLocale\n            } else {\n                tts?.language = Locale.getDefault()\n            }'
          if ar_old in s:
              s = s.replace(ar_old, ar_new, 1)

          speak_old = '        tts?.speak(cleanText, queueMode, params, "jarvis_speech")'
          speak_new = '        val result = tts?.speak(cleanText, queueMode, params, "jarvis_${System.currentTimeMillis()}")\n        if (result == TextToSpeech.ERROR) {\n            Log.e("JarvisTts", "TTS speak() returned ERROR")\n        }'
          if speak_old in s:
              s = s.replace(speak_old, speak_new, 1)

          p.write_text(s)
          PY

      - name: Build debug APK
        shell: bash
        working-directory: source
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
